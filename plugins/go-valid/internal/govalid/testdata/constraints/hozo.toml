# plugins/go-valid の単体テストの入力（docs/testing.md「単体テスト」）: docs/plugin-go-valid.md「制約」の表の各行と、
# 「scalar」「model」の形（サンプルが使わない pattern / max / record / 省略可能 を含む）。

# 1: 共有の型。app の Validate が、ここの型のメソッドを呼ぶ
[[emit]]
namespace   = "type"
transpilers = ["go", "go-valid"]
out         = "gen/type"

# 2: 制約と、包まれた型のすべて。内部の op を持たないので、定義のパッケージは入口と同じ
[[emit]]
namespace   = "app"
transpilers = ["go", "go-valid"]
out         = "gen/app"

# 3: 内部の op を持つ名前空間。validate.go は、内側のパッケージに置く
[[emit]]
namespace   = "split"
transpilers = ["go", "go-valid"]
out         = "gen/split"
