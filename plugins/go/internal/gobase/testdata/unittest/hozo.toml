[options.go]
module = "example.com/app"

# plugins/go の単体テストの入力（docs/testing.md「単体テスト」）: plugins/go/spec/go.hozo の Requirement.UnitTestPort と「効果の入口の確かめ」。
[[emit]]
namespace   = "app"
transpilers = ["go"]
out         = "gen/app"

# app が使う型、例外、述語で決まる分類の置き場（docs/config.md「型の置き場」）
[[emit]]
namespace   = "stock"
transpilers = ["go"]
out         = "gen/stock"
