# plugins/go の単体テストの入力（docs/testing.md「単体テスト」）: GO-2（生成する名前が当たる。plugins/go/spec/go.hozo の Requirement.Names）の各条件。
# 条件ごとに名前空間を分け、一つの単位（namespace = "c"）が、子孫の c.* をすべて出力する。
[hozo]
plugin_dirs = ["plugins"]

[options.go]
module = "example.com/app"

[[emit]]
namespace   = "c"
transpilers = ["go", "go-rate"]
out         = "gen/c"
