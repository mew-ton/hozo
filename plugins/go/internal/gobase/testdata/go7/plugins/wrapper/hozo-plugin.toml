# 単体テストの入力のためのプラグイン: 本体のあるデコレータ a.counted に、継ぎ目を宣言する相乗り（docs/config.md「継ぎ目」）。
# 基底 go の単体テストが読むのは View.config.seams だけで、このプラグインは起動しない。
name     = "wrapper"
command  = ["sh", "-c", "cat >/dev/null; echo '{\"files\":[],\"warnings\":[]}'"]
protocol = "0.22"

[[transpiler]]
name     = "go-wrap"
language = "go"
requires = ["go"]
seams    = ["a.counted", "a.plain"]
