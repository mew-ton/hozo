# 単体テストの入力のためのプラグイン: 継ぎ目を宣言する二つの相乗り（docs/config.md「継ぎ目」）。基底 go の単体テストが
# 読むのは View.config.seams だけで、このプラグインは起動しない（wasm のファイルは、置いていない）。
name     = "seamers"
wasm     = "plugin.wasm"
protocol = "0.27"

[[transpiler]]
name     = "go-rate"
language = "go"
requires = ["go"]
seams    = ["t.limited"]

[[transpiler]]
name     = "go-trace"
language = "go"
requires = ["go"]
seams    = ["t.traced", "t.unused"]
