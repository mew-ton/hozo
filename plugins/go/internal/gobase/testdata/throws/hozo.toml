[options.go]
module = "example.com/app"

# plugins/go の単体テストの入力（docs/testing.md「単体テスト」）: plugins/go/spec/go.hozo の Requirement.Types の「exception」（引数ごとにフィールド一つ）と、
# 「match」の「アームの本体」の `throw E(<値>, …)`。
[[emit]]
namespace   = "app"
transpilers = ["go"]
out         = "gen/app"

# app が投げる例外の置き場（docs/config.md「型の置き場」）
[[emit]]
namespace   = "limits"
transpilers = ["go"]
out         = "gen/limits"
