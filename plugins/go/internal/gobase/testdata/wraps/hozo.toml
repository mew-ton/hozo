# plugins/go の単体テストの入力（docs/testing.md「単体テスト」）: docs/plugin-go.md「本体のあるデコレータ」の各行。
[hozo]
plugin_dirs = ["plugins"]

# 1: gate。本体のあるデコレータを宣言する名前空間。自分の op にも付ける
[[emit]]
namespace   = "gate"
transpilers = ["go"]
out         = "gen/gate"

# 2: trace。継ぎ目のデコレータが投げる例外の型（デコレータのテストの口が、参照する）
[[emit]]
namespace   = "trace"
transpilers = ["go"]
out         = "gen/trace"

# 3: shop。gate のデコレータを、別の名前空間から付ける。単位の継ぎ目は trace.traced（go-trace）
[[emit]]
namespace   = "shop"
transpilers = ["go", "go-trace"]
out         = "gen/shop"

# 4: desk。例外を受ける、継ぎ目のデコレータ（trace.quiet、trace.steady、trace.renamed、trace.stopped、trace.swapped、trace.echoed、trace.muted。go-trace）を付ける
[[emit]]
namespace   = "desk"
transpilers = ["go", "go-trace"]
out         = "gen/desk"
