# 単体テストの入力のためのプラグイン: 継ぎ目を宣言する相乗り（docs/config.md「継ぎ目」）。基底 go の単体テストが読むのは
# View.config.seams だけで、このプラグインは起動しない。hozoc emit で試せるように、何も返さない sh の代役にしてある。
name     = "tracer"
command  = ["sh", "-c", "cat >/dev/null; echo '{\"files\":[],\"warnings\":[]}'"]
protocol = "0.21"

[[transpiler]]
name     = "go-trace"
language = "go"
requires = ["go"]
seams    = ["trace.traced", "trace.quiet", "trace.steady", "trace.renamed", "trace.stopped", "trace.swapped", "trace.echoed", "trace.muted"]
