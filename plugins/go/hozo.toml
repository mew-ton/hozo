# Go の基底 go 自身の要求（plugins/go/spec/go.hozo）。このディレクトリを、一つの Hozo のプロジェクトにする
[hozo]
sources     = ["spec/**/*.hozo"]
plugin_dirs = [".."]

# Go のモジュールのパスに、このディレクトリまでのパスを足したもの（モジュールは、リポジトリのルートの go.mod）
[options.go]
module = "github.com/mew-ton/hozo/plugins/go"

# 要求ごとの、テストの入れ物の口は go-design
[[emit]]
namespace   = "hozo.gobase"
transpilers = ["go", "go-design"]
out         = "internal/spec"

[emit.options.go-design]
requirements = ["hozo.gobase.Requirement"]
