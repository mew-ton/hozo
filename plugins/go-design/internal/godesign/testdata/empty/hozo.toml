[options.go]
module = "example.com/app"

# plugins/go-design の単体テストの入力（docs/testing.md「単体テスト」）: フローも、要求もない単位（plugins/go-design/spec/go-design.hozo の Requirement.Targets）。
# ファイルを出さず、warning を一つ返す。
[[emit]]
namespace   = "app"
transpilers = ["go", "go-design"]
out         = "gen/app"

# requirements を、空の配列で書いても、同じ
[[emit]]
namespace   = "other"
transpilers = ["go", "go-design"]
out         = "gen/other"

[emit.options.go-design]
requirements = []
