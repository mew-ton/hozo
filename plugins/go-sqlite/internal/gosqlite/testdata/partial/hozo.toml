[options.go]
module = "example.com/app"

# plugins/go-sqlite の単体テストの入力（docs/testing.md「単体テスト」）: docs/plugin-go-sqlite.md「状態ごとの型」の、db の語彙の
# デコレータを付けていない read と効果があるとき（その型は、メソッドを持たず、var _ を出さない。warning も出さない）と、
# 型を出さない単位（表の状態でない状態、述語で決まる状態の分類）。
[[emit]]
namespace   = "lib"
transpilers = ["go", "go-sqlite"]
out         = "gen/lib"
