# plugins/go-sqlite の単体テストの入力（docs/testing.md「単体テスト」の「型に依らない形の確かめ」）: フィールドの型だけを変えた
# 三つの名前空間（核の型、scalar、省略可能）。宣言の名前、デコレータ、op は同じ。出力は、名前と型のほかは同じテキストになる
# （省略可能な列は、@db.nullable が足す引数と、NOT NULL の有無だけが違う）。
[[emit]]
namespace   = "plain"
transpilers = ["go", "go-sqlite"]
out         = "gen/plain"

[[emit]]
namespace   = "named"
transpilers = ["go", "go-sqlite"]
out         = "gen/named"

[[emit]]
namespace   = "sparse"
transpilers = ["go", "go-sqlite"]
out         = "gen/sparse"
