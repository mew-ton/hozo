# 単体テストの入力のためのプラグイン: 継ぎ目を宣言する、もう一つの相乗り（docs/config.md「継ぎ目」）。go-sqlite の単体テストが
# 読むのは View.config.seams だけで、このプラグインは起動しない。hozoc emit で試せるように、何も返さない sh の代役にしてある。
name     = "tracer"
command  = ["sh", "-c", "cat >/dev/null; echo '{\"files\":[],\"warnings\":[]}'"]
protocol = "0.20"

[[transpiler]]
name     = "go-trace"
language = "go"
requires = ["go"]
seams    = ["t.traced"]
