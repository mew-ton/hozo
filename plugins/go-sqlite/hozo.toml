# go-sqlite 自身の要求（docs/plugin-go-sqlite.md「go-sqlite 自身の要求」）。このディレクトリを、一つの Hozo のプロジェクトにする
[hozo]
sources     = ["spec/**/*.hozo"]
plugin_dirs = [".."]

# Go のモジュールのパスに、このディレクトリまでのパスを足したもの（モジュールは、リポジトリのルートの go.mod）
[options.go]
module = "github.com/mew-ton/hozo/plugins/go-sqlite"

# 要求ごとの、テストの入れ物の口は go-design
[[emit]]
namespace   = "hozo.gosqlite"
transpilers = ["go", "go-design"]
out         = "internal/spec"

[emit.options.go-design]
requirements = ["hozo.gosqlite.Requirement"]
