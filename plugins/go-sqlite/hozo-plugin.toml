name     = "go-sqlite"
wasm     = "plugin.wasm"
protocol = "0.25"

# 提供するトランスパイラは一つ。Go の基底 go に相乗りする（docs/plugin-go-sqlite.md「マニフェスト」）。
# 読む語彙は db（標準の語彙。docs/vocab.md「同梱する語彙」）で、語彙は提供しない
[[transpiler]]
name     = "go-sqlite"
language = "go"
requires = ["go"]
# @db.transaction は継ぎ目: 基底が、付いた op を二層で出し、このトランスパイラが、その中身（DbSeams）を出す（同「トランザクション」）
seams    = ["db.transaction"]
# db の語彙の検査（DB-*）を通った仕様だけを、受け取る（同「マニフェスト」）
requires_vocabulary = ["db"]
interprets = [
  "db.table", "db.text", "db.int", "db.float",
  "db.bool", "db.datetime", "db.date", "db.time",
  "db.json", "db.key", "db.unique", "db.ref",
  "db.find", "db.list", "db.where", "db.latest",
  "db.insert", "db.update", "db.delete", "db.conflict",
]
