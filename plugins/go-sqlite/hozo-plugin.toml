name     = "go-sqlite"
command  = ["go", "run", "github.com/mew-ton/hozo/plugins/go-sqlite"]
protocol = "0.8"

# 提供するトランスパイラは一つ。Go の基底 go に相乗りする（docs/plugin-go-sqlite.md「マニフェスト」）。
# 読む語彙は db（標準の語彙。docs/vocab.md「同梱する語彙」）で、語彙は提供しない
[[transpiler]]
name     = "go-sqlite"
language = "go"
requires = ["go"]
# @db.transaction は継ぎ目: 基底が、付いた op を二層で出し、このトランスパイラが、その中身（DbSeams）を出す（同「トランザクション」）
seams    = ["db.transaction"]
