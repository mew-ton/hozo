name     = "go-cli"
command  = ["go", "run", "github.com/mew-ton/hozo/plugins/go-cli"]
protocol = "0.18"

vocabulary = ["cli.hozo"]       # cli の語彙はこのプラグインが提供する（docs/vocab.md「同梱しない語彙」）

# 提供するトランスパイラは一つ。Go の基底 go と、検証の go-valid に相乗りする（docs/plugin-go-cli.md「マニフェスト」）
[[transpiler]]
name     = "go-cli"
language = "go"
requires = ["go", "go-valid"]

[check]
enabled = true                  # emit が errors で返す誤りを、検査の段（hozoc check）でも返す（docs/plugin-protocol.md「check」）
