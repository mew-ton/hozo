# plugins/go-cli の単体テストの入力（docs/testing.md「単体テスト」）: CLI-7（ディレクトリ cli が、同じ単位が出力する子の名前空間 N.cli の出力先と重なる）。

[options.go]
module = "example.com/app"

# 1: app と、その子の app.cli を出力する（Dir(U, app.cli) は gen/app/cli）
[[emit]]
namespace   = "app"
transpilers = ["go", "go-valid", "go-cli"]
out         = "gen/app"

# 2: other を出力する。子の other.cli は in の外なので、この単位は出力しない（重ならない）
[[emit]]
in          = ["other.hozo"]
namespace   = "other"
transpilers = ["go", "go-valid", "go-cli"]
out         = "gen/other"

# 3: quiet と、その子の quiet.cli を出力する。quiet に @cli.command の op がなければ、cli.go を出さないので、重ならない
[[emit]]
namespace   = "quiet"
transpilers = ["go", "go-valid", "go-cli"]
out         = "gen/quiet"
