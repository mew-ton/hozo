# plugins/go-cli の単体テストの入力（docs/testing.md「単体テスト」）: plugins/go-cli/spec/go-cli.hozo の Requirement.Output、Requirement.Arguments、Requirement.CommandFunctions、Requirement.Run、Requirement.Usage の各行。

[options.go]
module = "example.com/app"

# 1: tool。内部の op を持つ（基底の出力は、内側のフォルダと入口に分かれる。cli.go が import するのは入口）。
# 入力は省略可能なフラグと環境変数と、残りすべての位置引数。例外は、引数を持つもの（一つと、三つ）、持たないもの、終了コードのないもの、別の名前空間のもの
[[emit]]
namespace   = "tool"
transpilers = ["go", "go-valid", "go-cli"]
out         = "gen/tool"

# 2: demo。内部の op を持たない。値の変換（int / float / boolean / scalar）、値が与えられなかったときの三つの扱い（@cli.required、
# @cli.default、どちらもない）、位置を書いた @cli.arg、名前を省いた @cli.flag / @cli.env、引数のない op、never を返す op
[[emit]]
namespace   = "demo"
transpilers = ["go", "go-valid", "go-cli"]
out         = "gen/demo"

# 3: tool の op が投げる例外の型の置き場（docs/config.md「型の置き場」）
[[emit]]
namespace   = "fail"
transpilers = ["go"]
out         = "gen/fail"

# 4: bare。入力も例外も持たないコマンドだけ（行のメソッド、cliValidate、cliThrown と、runtime の import を出さない）
[[emit]]
namespace   = "bare"
transpilers = ["go", "go-valid", "go-cli"]
out         = "gen/bare"
