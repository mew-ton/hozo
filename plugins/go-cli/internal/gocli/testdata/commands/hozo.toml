# plugins/go-cli の単体テストの入力（docs/testing.md「単体テスト」）: docs/plugin-go-cli.md「出力」「引数の解釈」「実行と表示」「使い方の表示」の各行。

# 1: tool。内部の op を持つ（基底の出力は、内側のフォルダと入口に分かれる。cli.go が import するのは入口）。
# 入力は省略可能なフラグと環境変数と、残りすべての位置引数。例外は、値を運ぶもの、終了コードのないもの、別の名前空間のもの
[[emit]]
namespace   = "tool"
transpilers = ["go", "go-valid", "go-cli"]
out         = "gen/tool"

# 2: demo。内部の op を持たない。値の変換（int / float / boolean / scalar）、必須、既定値、位置引数、引数のない op、never を返す op
[[emit]]
namespace   = "demo"
transpilers = ["go", "go-valid", "go-cli"]
out         = "gen/demo"

# 3: tool の op が投げる例外の型の置き場（docs/config.md「型の置き場」）
[[emit]]
namespace   = "fail"
transpilers = ["go"]
out         = "gen/fail"
