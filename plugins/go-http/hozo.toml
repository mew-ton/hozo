# go-http 自身の要求（docs/plugin-go-http.md「go-http 自身の要求」）。このディレクトリを、一つの Hozo のプロジェクトにする
[hozo]
sources     = ["spec/**/*.hozo"]
plugin_dirs = [".."]

# Go のモジュールのパスに、このディレクトリまでのパスを足したもの（モジュールは、リポジトリのルートの go.mod）
[options.go]
module = "github.com/mew-ton/hozo/plugins/go-http"

# 要求ごとの、テストの入れ物の口は go-design
[[emit]]
namespace   = "hozo.gohttp"
transpilers = ["go", "go-design"]
out         = "internal/spec"
# 補助の設計（spec/runtime.hozo。名前空間 hozo.gohttp.runtime）は、まだコードにしない（docs/plugin-go-http.md「補助の設計」）
in          = ["spec/go-http.hozo"]

[emit.options.go-design]
requirements = ["hozo.gohttp.Requirement"]
