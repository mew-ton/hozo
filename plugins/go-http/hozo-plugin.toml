name     = "go-http"
command  = ["go", "run", "github.com/mew-ton/hozo/plugins/go-http"]
protocol = "0.21"

# 提供するトランスパイラは一つ。Go の基底 go と、検証の go-valid に相乗りする（docs/plugin-go-http.md「マニフェスト」）
[[transpiler]]
name     = "go-http"
language = "go"
requires = ["go", "go-valid"]

[check]
enabled = true                  # emit が errors で返す誤りを、検査の段（hozoc check）でも返す（docs/plugin-protocol.md「check」）
