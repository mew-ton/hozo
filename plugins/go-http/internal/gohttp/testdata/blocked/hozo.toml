# plugins/go-http の単体テストの入力（docs/testing.md「単体テスト」）: テストの中の組み立てを作れない出力（TestBlockedComposition）。
[[emit]]
namespace   = "app"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/app"

[[emit]]
namespace   = "other"
transpilers = ["go"]
out         = "gen/other"

# 同じ other を、もう一つの単位にも出す
[[emit]]
namespace   = "other"
transpilers = ["go"]
out         = "gen/other2"
