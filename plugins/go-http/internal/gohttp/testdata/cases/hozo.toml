# plugins/go-http の単体テストの入力（docs/testing.md「単体テスト」）: docs/plugin-go-http.md「インテグレーションテストの口」のうち、
# 入力 routes が使わない場合: 結果の名前が当たるとき、never を返す op、Given・Request・Then と当たる引数の名前、
# 基底が、テストのパッケージを作らない出力。

# 1: app が使う例外と、wired が呼ぶ op の置き場
[[emit]]
namespace   = "other"
transpilers = ["go"]
out         = "gen/other"

# 2: 結果の名前と、入力のフィールドの名前
[[emit]]
namespace   = "app"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/app"

# 3: 葉の op も、判定の口を出す分類もない名前空間（基底は、テストのパッケージを作らない）
[[emit]]
namespace   = "wired"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/wired"

# にせものにするものがない出力: 口は、Fakes を使わない形（docs/plugin-go-http.md「インテグレーションテストの口」の「口の形」）
[[emit]]
namespace   = "plain"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/plain"

[[emit]]
namespace   = "parcel"
transpilers = ["go", "go-valid"]
out         = "gen/parcel"

[[emit]]
namespace   = "counter"
transpilers = ["go"]
out         = "gen/counter"

[[emit]]
namespace   = "gate"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/gate"
