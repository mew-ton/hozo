# plugins/go-http の単体テストの入力（docs/testing.md「単体テスト」）: GOHTTP-11（validate = true で、Validate を持つ入力の model が
# 別の名前空間のもので、その型の置き場の単位が go-valid を並べていない）。

# 1: 入力の model の置き場。go-valid を並べていない（Validate を出さない）
[[emit]]
namespace   = "plain"
transpilers = ["go"]
out         = "gen/plain"

# 2: 入力の model の置き場。go-valid を並べている
[[emit]]
namespace   = "checked"
transpilers = ["go", "go-valid"]
out         = "gen/checked"

# 3: validate = true
[[emit]]
namespace   = "app"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/app"

[emit.options.go-http]
validate = true

# 4: 同じ op でも、validate = false なら Validate を呼ばないので、診断はない
[[emit]]
namespace   = "app"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/loose"
