[options.go]
module = "example.com/app"

# plugins/go-http の単体テストの入力（docs/testing.md「単体テスト」）: 名前空間のパッケージの名前が、生成したコードの局所の名前
# （ops、mux、w、r、in、req、out、err）や、標準ライブラリのパッケージの名前と同じとき。局所の名前の方の末尾に _ を足す。
# 標準ライブラリと同じ名前の名前空間のパッケージ（strconv、reflect）と、基底の非公開の名前と同じもの（ops）は、名前空間の方に 2 が付く。
[[emit]]
namespace   = "api"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/api"

[emit.options.go-http]
validate = true

[[emit]]
namespace   = "w"
transpilers = ["go", "go-valid"]
out         = "gen/w"

[[emit]]
namespace   = "err"
transpilers = ["go", "go-valid"]
out         = "gen/err"

[[emit]]
namespace   = "in"
transpilers = ["go", "go-valid"]
out         = "gen/in"

[[emit]]
namespace   = "out"
transpilers = ["go", "go-valid"]
out         = "gen/out"

[[emit]]
namespace   = "r"
transpilers = ["go", "go-valid"]
out         = "gen/r"

[[emit]]
namespace   = "req"
transpilers = ["go", "go-valid"]
out         = "gen/req"

[[emit]]
namespace   = "mux"
transpilers = ["go", "go-valid"]
out         = "gen/mux"

[[emit]]
namespace   = "ops"
transpilers = ["go", "go-valid"]
out         = "gen/ops"

[[emit]]
namespace   = "strconv"
transpilers = ["go", "go-valid"]
out         = "gen/strconv"

[[emit]]
namespace   = "reflect"
transpilers = ["go", "go-valid"]
out         = "gen/reflect"
