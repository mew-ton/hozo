# plugins/go-http の単体テストの入力（docs/testing.md「単体テスト」）: docs/plugin-go-http.md「補助」の「union の読み書き」の、
# リテラルの型（表 httpConsts、リテラルの型のアーム、印で見分ける union）。

[options.go]
module = "example.com/app"

# 1: 別の名前空間の model（union のアームにすると、包む型になる）
[[emit]]
namespace   = "kinds"
transpilers = ["go"]
out         = "gen/kinds"

# 2: リテラルの型を、本文、結果、例外の引数に持つ経路
[[emit]]
namespace   = "api"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/api"
