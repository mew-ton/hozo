[options.go]
module = "example.com/app"

# plugins/go-http の単体テストの入力（docs/testing.md「単体テスト」）: GOHTTP-21（テストのパッケージのディレクトリが、同じ単位が出力する
# 子の名前空間 N.<N のパッケージ名>test の出力先と重なる）。
# 単位は n とその子孫（n.ntest）を出力する: Dir(U, n) は gen/n、Dir(U, n.ntest) は gen/n/ntest。
[[emit]]
namespace   = "n"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/n"

# 基底も、テストのパッケージを作る出力（葉の op がある）: 基底が、同じことを GO-4 で返すので、go-http は、返さない
[[emit]]
namespace   = "m"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/m"
