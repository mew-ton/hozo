# テスト用のプラグイン。トランスパイラ none は、requires を持たない、テストのための基底で、ファイルを返さない
# （emit の応答は、頼まれたトランスパイラごとに、空の files と warnings の答え）。中身は、にせもののプラグイン
# （internal/fakeplugin）の WASM で、テストが、wasm の場所に置く（docs/testing.md「環境からの独立」）。
name     = "none"
wasm     = "plugin.wasm"
protocol = "1.0"

[[transpiler]]
name     = "none"
language = "go"
