# 出力の対象のコーパス（docs/testing.md「コーパス」、README.md）: 既定の出力は、プラグインが選んだ宣言だけを出す
# （docs/emit-go.md「出力の対象」、docs/plugin-protocol.md「選択」）。
# shop にはテスト用の pick（plugins/pick）を設定する。stock はテーブルはあるがプラグインがないので、何も出力しない。

[hozo]
plugin_dirs = ["plugins"]

[shop]
language = "go"
out      = "gen/shop"
plugins  = ["pick"]

[stock]
language = "go"
out      = "gen/stock"
