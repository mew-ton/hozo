# 設計書 §5〜§11 の例のコーパス（docs/testing.md「コーパス」）。
# 設計書 §4.5 では browser は TS だが、TS の基底はまだないので、今は両方とも Go の基底 go で出力する（README.md）。
# go は、リポジトリの plugins/ のプラグイン。テストが HOZO_PLUGIN_PATH として渡す（docs/testing.md「コーパス」）。
# 設計書のプラグイン（http のサーバー、ルーター、db）は並べないので、語彙のデコレータは印のまま（docs/plugin-go.md「デコレータ」）。

[hozo]
sources = ["**/*.hozo"]

# Go のモジュールの名前（go.mod の module と同じもの。docs/plugin-go.md「マニフェスト」）。プロジェクト全体のオプション
[options.go]
module = "github.com/mew-ton/hozo"

[[emit]]
namespace   = "server"
transpilers = ["go"]
out         = "gen/server"

[[emit]]
namespace   = "browser"
transpilers = ["go"]
out         = "gen/browser"

# 使う型の置き場（docs/config.md「型の置き場」）: browser と server が、語彙 http と page の型（例外、page.Route）を使う
[[emit]]
namespace   = "http"
transpilers = ["go"]
out         = "gen/http"

[[emit]]
namespace   = "page"
transpilers = ["go"]
out         = "gen/page"
