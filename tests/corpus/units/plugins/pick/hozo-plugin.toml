# テスト用のプラグイン（tests/plugins/pick）。一つのプラグインが四つのトランスパイラを提供する（docs/plugin-protocol.md「マニフェスト」）。
# どのトランスパイラが何を選ぶかは、隣の pick.json の transpilers に書く。ファイルは出さない。
name     = "pick"
command  = ["go", "run", "github.com/mew-ton/hozo/tests/plugins/pick"]
protocol = "0.2"

[[transpiler]]
name     = "pick-stock"
language = "go"

[[transpiler]]
name     = "pick-api"
language = "go"

[[transpiler]]
name     = "pick-batch"
language = "go"

[[transpiler]]
name     = "pick-admin"
language = "go"
