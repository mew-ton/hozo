# View のコーパス（docs/testing.md「コーパス」、tests/view_test.go）。
# api と web は本来 server / browser の関係だが、TS の既定の出力は段階 5 までないので（CFG-11）どちらも Go のトランスパイラ。
# web の単位には view-dump（plugins/view-dump のトランスパイラ）を書き、トランスパイラが受け取る View を書き出させる。
# api の単位の view-none は同じプラグインのもう一つのトランスパイラで、何も選ばない（api は何も出力しない）。

[hozo]
plugin_dirs = ["plugins"]

[[emit]]
namespace   = "api"
transpilers = ["view-none"]
out         = "gen/api"

[[emit]]
namespace   = "web"
transpilers = ["view-dump"]
out         = "gen/web"
