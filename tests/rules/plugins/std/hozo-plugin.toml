# tests/rules の既定の fixture（tests/rules_test.go が各例のプロジェクトの plugins/ に写す）。
# 基底 go / go-b（言語は go）と ts（言語は ts）、go に相乗りする go-x、go と go-x に相乗りする go-y を提供する
# （docs/testing.md「規則ごとのテスト」）。このテストは、プラグインを起動しない（tests/rules_test.go）
name     = "std"
wasm     = "plugin.wasm"
protocol = "0.23"

[[transpiler]]
name     = "go"
language = "go"

[[transpiler]]
name     = "go-b"
language = "go"

[[transpiler]]
name     = "ts"
language = "ts"

[[transpiler]]
name     = "go-x"
language = "go"
requires = ["go"]

[[transpiler]]
name     = "go-y"
language = "go"
requires = ["go", "go-x"]
