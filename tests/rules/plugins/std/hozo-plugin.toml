# tests/rules の既定の fixture（tests/rules_test.go が各例のプロジェクトの plugins/ に写す）。
# 基底 go / go-b（言語は go）と ts（言語は ts）、go に相乗りする go-x、go と go-x に相乗りする go-y を提供する
# （docs/testing.md「規則ごとのテスト」）。起動しない（[check] enabled は既定の false）
name     = "std"
command  = ["true"]
protocol = "0.11"

[[transpiler]]
name     = "go"
language = "go"

[[transpiler]]
name     = "go-b"
language = "go"

[[transpiler]]
name     = "ts"
language = "ts"

[[transpiler]]
name     = "go-x"
language = "go"
requires = ["go"]

[[transpiler]]
name     = "go-y"
language = "go"
requires = ["go", "go-x"]
