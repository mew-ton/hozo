# 単体テストの入力のためのプラグイン: 継ぎ目を宣言する、もう一つの相乗り（docs/config.md「継ぎ目」）。go-ratelimit の単体テストが
# 読むのは View.config.seams だけで、このプラグインは起動しない（wasm のファイルは、置いていない）。
name     = "tracer"
