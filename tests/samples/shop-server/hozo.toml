# サンプル shop-server（tests/samples/README.md）: docs/decisions.md の P1〜P39 の後の形。
# 名前空間は、仕様の七つ（type、store、server、mailer、design、client、flows）と、サンプルの中のプラグインの語彙 rate と、標準の語彙 http。
# 単位は七つ。mailer と design には単位を置かない（コードを出さない）。
# 単位の transpilers には、依存しているものもすべて書く（P18）。期待する出力は、それぞれの out のディレクトリ（README.md）。

[hozo]
plugin_dirs = ["plugins"]       # サンプルの中のプラグイン go-ratelimit（語彙 rate と、その継ぎ目の中身。P38）
max_bindings = 6                # 既定は 5。server.getMyPage が、val を六つ持つ（disjoint の外に出す三つを含む。README.md「R6 で変えたこと」）

# 1: 共有の型。言語ごとに一度だけ出し、ほかの単位は import する（P7）
[[emit]]
namespace   = "type"
transpilers = ["go", "go-valid"]
out         = "gen/type"

# 2: 語彙 rate の型（例外 rate.LimitExceeded）。server が使うので、同じ基底の単位が要る（語彙の名前空間の単位。P7）
[[emit]]
namespace   = "rate"
transpilers = ["go"]
out         = "gen/rate"

# 3: DB の状態と、それに触れる read と効果と、それを呼ぶ op。read と効果の中身は go-sqlite が出す。
#    go-sqlite が @db.transaction の継ぎ目を宣言しているので、placeOrder は二層になる
[[emit]]
namespace   = "store"
transpilers = ["go", "go-sqlite"]
out         = "gen/store"

# 4: HTTP の入口と業務の流れ。go-ratelimit が @rate.limited の継ぎ目を宣言しているので、login は二層になる
[[emit]]
namespace   = "server"
transpilers = ["go", "go-valid", "go-http", "go-ratelimit"]
out         = "gen/server"

[emit.options.go-http]
validate = true                 # 要求を受けたときに制約を確かめる（P15、P16）

# 5: 標準の語彙 http の型（例外 http.ServerError、http.NetworkError）。client と flows が、throws に書くので、同じ基底の単位が要る（P7）
[[emit]]
namespace   = "http"
transpilers = ["go"]
out         = "gen/http"

# 6: 画面の側の、操作の op（ユースケース）。機能入口の op（server の、外に出した op）を呼ぶ
[[emit]]
namespace   = "client"
transpilers = ["go"]
out         = "gen/client"

# 7: 業務フロー。テスト用の単位: go-design が、フローごとの E2E テストの口と、要求ごとの、テストの入れ物の口を出す
[[emit]]
namespace   = "flows"
transpilers = ["go", "go-design"]
out         = "gen/flows"

[emit.options.go-design]
requirements = ["design.Requirement"]   # 要求の分類。ケースごとに、テストの入れ物を一つ求める
