# サンプル shop-server（tests/samples/README.md）: docs/decisions.md の P1〜P33 の後の形。
# 名前空間は四つ（type、store、server、mailer）で、単位は四つ。mailer には単位を置かない（コードを出さない）。
# 単位の transpilers には、依存しているものもすべて書く（P18）。期待する出力は、それぞれの out のディレクトリ（README.md）。

# 1: 共有の型。言語ごとに一度だけ出し、ほかの単位は import する（P7）
[[emit]]
namespace   = "type"
transpilers = ["go", "go-valid"]
out         = "gen/type"

# 2: DB の状態と、それを読み書きする op。op の中身は go-sqlite が出す
[[emit]]
namespace   = "store"
transpilers = ["go", "go-sqlite"]
out         = "gen/store"

# 3: 同じ store を、DB なしで。op の中身は、人がメモリの上に書く
[[emit]]
namespace   = "store"
transpilers = ["go"]
out         = "gen/storemem"

# 4: HTTP の入口と業務の流れ
[[emit]]
namespace   = "server"
transpilers = ["go", "go-valid", "go-http"]
out         = "gen/server"

[emit.options.go-http]
validate = true                 # 要求を受けたときに制約を確かめる（P15、P16）
