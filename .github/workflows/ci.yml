name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # 生成物の一致（docs/testing.md「生成物の一致」）: cli.hozo から internal/gen/hozoc/** を生成し直して差分がないこと
      - run: make generate
      - run: git diff --exit-code
