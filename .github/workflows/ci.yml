name: ci
on:
  push:
    branches: [main]
  pull_request:
# 実行は、同時に一つだけ（docs/testing.md「CI」）: main への push も、どの PR も、同じ組。新しい実行が始まると、前の実行は止まる
concurrency:
  group: ci
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # 生成物の一致（docs/testing.md「生成物の一致」）: docs/packages.md「生成するもの」の表を生成し直して差分がないこと
      # go generate: IR の JSON スキーマ（schema/ir.schema.json、internal/tools/irschema）と
      # TextMate の文法（editors/vscode/syntaxes、internal/tools/tmgrammar）など
      - run: go generate ./...
      # make generate: 自己生成（docs/packages.md「自己生成の手順」）
      - run: make generate
      - run: git diff --exit-code
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run build
      # TextMate の文法で実物の .hozo を字句に分け、scope を確かめる（docs/editors.md「TextMate の文法」）
      - run: npm test
  # 秘密の検出（docs/testing.md「CI」）: リポジトリのすべてのファイルを SecretLint で調べる。版は tools/secretlint の package-lock.json
  secretlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/secretlint/package-lock.json
      - run: npm ci
        working-directory: tools/secretlint
      - run: tools/secretlint/node_modules/.bin/secretlint --secretlintrc tools/secretlint/.secretlintrc.json "**/*"
